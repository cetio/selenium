[project]
site_name = "Selenium"
extra_css = ["stylesheets/api.css"]
site_description = "Native D implementation of the W3C WebDriver protocol for Chrome, Firefox, Edge, and Safari."
site_url = "https://mortifying.si/selenium/"
repo_url = "https://github.com/cetio/selenium"
edit_uri = "https://github.com/cetio/selenium/edit/master/docs/"

nav = [
  { "Home" = "README.md" },
  { "WebDriver" = [
    "webdriver/README.md",
    "webdriver/BRIDGE.md",
    "webdriver/DRIVER.md",
    "webdriver/ELEMENTS.md",
    "webdriver/ACTIONS.md",
  ] },
  { "Grid" = "grid/README.md" },
  # api-nav-begin
  { "API Reference" = [
    "api/index.md",
    "api/selenium.md",
    "api/selenium.bridge.md",
    "api/selenium.element.md",
    "api/selenium.exception.md",
    "api/selenium.locator.md",
    "api/selenium.root.md",
    { "actions" = [
      "api/selenium.actions.md",
      "api/selenium.actions.key.md",
      "api/selenium.actions.pointer.md",
    ] },
    { "browser" = [
      "api/selenium.browser.md",
      "api/selenium.browser.chrome.md",
      "api/selenium.browser.edge.md",
      "api/selenium.browser.firefox.md",
      "api/selenium.browser.safari.md",
    ] },
    { "driver" = [
      "api/selenium.driver.md",
      "api/selenium.driver.cookies.md",
      "api/selenium.driver.logger.md",
      "api/selenium.driver.print.md",
    ] },
    { "grid" = [
      "api/selenium.grid.md",
      { "server" = [
        "api/selenium.grid.server.md",
        "api/selenium.grid.server.http.md",
        "api/selenium.grid.server.hub.md",
        "api/selenium.grid.server.model.md",
        "api/selenium.grid.server.node.md",
      ] },
    ] },
  ] },
  # api-nav-end
]

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
tables = {}
fenced_code = {}
admonition = {}

[project.theme]
features = [
  "content.action.copy",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
]

# Dark mode by default, with a toggle to light
[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "orange"
toggle.icon = "lucide/moon-star"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[project.theme.icon.tag]
default = "lucide/hash"
