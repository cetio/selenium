name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install D compiler (dmd-latest)
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd-latest

      - name: Run tests with Chrome and Firefox
        run: dub test --d-version=chrome --d-version=firefox
