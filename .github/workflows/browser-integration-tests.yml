name: Browser Integration Tests

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      browser:
        required: true
        type: string
      compiler:
        required: false
        type: string
        default: ldc-latest

permissions:
  contents: read

jobs:
  test:
    name: ${{ inputs.browser }} (${{ inputs.os }})
    runs-on: ${{ inputs.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ inputs.compiler }}

      - name: Cache DUB packages and build cache
        uses: actions/cache@v4
        env:
          DUB_CACHE_KEY: dub-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.compiler }}
        with:
          path: |
            ${{ runner.temp }}/dub/packages
            ${{ runner.temp }}/dub/cache
          key: ${{ env.DUB_CACHE_KEY }}-${{ hashFiles('dub.json', 'dub.selections.json') }}
          restore-keys: |
            ${{ env.DUB_CACHE_KEY }}-

      - name: Run integration tests
        env:
          DUB_HOME: ${{ runner.temp }}/dub
        run: dub test -c integration --d-version=${{ inputs.browser }}
