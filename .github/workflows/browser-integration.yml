name: Browser Integration Tests (CI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.browser }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        browser: [chrome, firefox]

    steps:
      - uses: actions/checkout@v4

      - name: Install D compiler (dmd-latest)
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd-latest

      - name: Run ${{ matrix.browser }} integration tests
        run: dub test --d-version=${{ matrix.browser }}
