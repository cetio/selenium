name: Unit Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        compiler: [ ldc-latest ]

    steps:
      - uses: actions/checkout@v4

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Cache DUB packages and build cache
        uses: actions/cache@v4
        env:
          DUB_CACHE_KEY: dub-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.compiler }}
        with:
          path: |
            ${{ runner.temp }}/dub/packages
            ${{ runner.temp }}/dub/cache
          key: ${{ env.DUB_CACHE_KEY }}-${{ hashFiles('dub.json', 'dub.selections.json') }}
          restore-keys: |
            ${{ env.DUB_CACHE_KEY }}-

      - name: Run unit tests
        env:
          DUB_HOME: ${{ runner.temp }}/dub
        run: dub test -c unit
